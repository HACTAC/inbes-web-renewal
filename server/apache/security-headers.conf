# BEGIN INBES SECURITY HEADERS
# Site-only seven-day HSTS; no includeSubDomains or preload.
# CSP intentionally leaves script/style/connect/frame sources unrestricted.
<IfModule mod_headers.c>
  Header onsuccess unset X-Content-Type-Options
  Header always set X-Content-Type-Options "nosniff"
  Header onsuccess unset X-Frame-Options
  Header always set X-Frame-Options "SAMEORIGIN"
  Header onsuccess unset Referrer-Policy
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header onsuccess unset Permissions-Policy
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
  Header onsuccess unset Content-Security-Policy
  Header always set Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
  Header onsuccess unset Strict-Transport-Security
  Header always set Strict-Transport-Security "max-age=604800"
</IfModule>
# END INBES SECURITY HEADERS
